name: Publish online runtime image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and configuration to target
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

permissions:
  id-token: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      resource_group: ${{ steps.config.outputs.resource_group }}
      workspace_name: ${{ steps.config.outputs.workspace_name }}
      runner: ${{ steps.config.outputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: config
        run: python3 mlops/scripts/export_config.py config-infra-${{ inputs.environment }}.yml

  publish:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    environment: ${{ inputs.environment }}
    outputs:
      immutable_image: ${{ steps.publish.outputs.immutable_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: publish
        name: Build and publish immutable runtime
        env:
          RESOURCE_GROUP: ${{ needs.config.outputs.resource_group }}
          WORKSPACE_NAME: ${{ needs.config.outputs.workspace_name }}
          IMAGE_TAG: ${{ github.sha }}
          KANIKO_EXECUTOR: /kaniko/executor
        run: |
          set -euo pipefail
          test -x "$KANIKO_EXECUTOR"
          "$KANIKO_EXECUTOR" version
          if [[ -S /var/run/docker.sock ]]; then
            echo "Docker socket must not be mounted on the private runner" >&2
            exit 1
          fi
          registry_id="$(az ml workspace show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKSPACE_NAME" \
            --query container_registry \
            --output tsv)"
          registry_name="${registry_id##*/}"
          login_server="$(az acr show \
            --name "$registry_name" \
            --query loginServer \
            --output tsv)"
          auth_dir="$(mktemp -d "$RUNNER_TEMP/kaniko-auth.XXXXXX")"
          digest_file="$(mktemp "$RUNNER_TEMP/kaniko-digest.XXXXXX")"
          cleanup() {
            unset token
            rm -f "$auth_dir/config.json" "$digest_file"
            rmdir "$auth_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          chmod 0700 "$auth_dir"
          token="$(az acr login \
            --name "$registry_name" \
            --expose-token \
            --query accessToken \
            --output tsv)"
          if [[ -z "$token" ]]; then
            echo "Azure CLI returned an empty ACR token" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          TOKEN="$token" LOGIN_SERVER="$login_server" AUTH_DIR="$auth_dir" \
            python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          username = "00000000-0000-0000-0000-000000000000"
          credential = f"{username}:{os.environ['TOKEN']}".encode()
          config = {
              "auths": {
                  os.environ["LOGIN_SERVER"]: {
                      "auth": base64.b64encode(credential).decode()
                  }
              }
          }
          path = Path(os.environ["AUTH_DIR"]) / "config.json"
          path.write_text(json.dumps(config), encoding="utf-8")
          path.chmod(0o600)
          PY
          DOCKER_CONFIG="$auth_dir" "$KANIKO_EXECUTOR" \
            --context "dir://$GITHUB_WORKSPACE/mlops/online-runtime" \
            --dockerfile "$GITHUB_WORKSPACE/mlops/online-runtime/Dockerfile" \
            --destination "$login_server/mlops/online-runtime:$IMAGE_TAG" \
            --digest-file "$digest_file" \
            --cleanup
          built_digest="$(cat "$digest_file")"
          if [[ ! "$built_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Kaniko did not report a SHA-256 manifest digest" >&2
            exit 1
          fi
          digest="$(az acr manifest show-metadata \
            --registry "$registry_name" \
            --name "mlops/online-runtime:$IMAGE_TAG" \
            --query digest \
            --output tsv)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image did not resolve to a SHA-256 manifest digest" >&2
            exit 1
          fi
          if [[ "$digest" != "$built_digest" ]]; then
            echo "Published manifest digest does not match the Kaniko result" >&2
            exit 1
          fi
          immutable_image="$login_server/mlops/online-runtime@$digest"
          if [[ ! "$immutable_image" =~ ^[^/]+/mlops/online-runtime@sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image URI is not an immutable runtime reference" >&2
            exit 1
          fi
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "Set \`online_environment_image: \"$immutable_image\"\` in the selected config." \
            >> "$GITHUB_STEP_SUMMARY"
