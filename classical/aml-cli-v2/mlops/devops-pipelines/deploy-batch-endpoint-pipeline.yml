name: deploy-batch-endpoint-pipeline

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - test
      - prod
  - name: agentPoolName
    displayName: Agent pool override (empty uses environment default)
    type: string
    default: ''
  - name: mlopsTemplatesRef
    displayName: mlops-templates branch, tag, or commit
    type: string
    default: refs/heads/main

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - template: ../../../../config-infra-dev.yml
  - ${{ if eq(parameters.environment, 'test') }}:
    - template: ../../../../config-infra-test.yml
  - ${{ if eq(parameters.environment, 'prod') }}:
    - template: ../../../../config-infra-prod.yml
  - name: endpoint_name
    value: $(batch_endpoint_name)
  - name: endpoint_type
    value: batch

trigger: none

${{ if ne(parameters.agentPoolName, '') }}:
  pool:
    name: ${{ parameters.agentPoolName }}
${{ else }}:
  pool:
    name: $(managed_devops_pool_alias)

resources:
  repositories:
    - repository: mlops-templates # Template Repo
      name: mlops-templates
      type: git
      ref: ${{ parameters.mlopsTemplatesRef }}

stages:
  - stage: CreateBatchEndpoint
    displayName: Create/Update Batch Endpoint
    jobs:
      - job: DeployBatchEndpoint
        steps:
          - checkout: self
            path: s/
          - template: templates/aml-cli-v2/setup.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              working_directory: $(System.DefaultWorkingDirectory)
          - template: templates/aml-cli-v2/create-endpoint.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              endpoint_type: batch
              endpoint_name: $(endpoint_name)
              endpoint_file: classical/aml-cli-v2/mlops/azureml/deploy/batch/batch-endpoint.yml
          - template: templates/aml-cli-v2/create-deployment.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              endpoint_type: batch
              endpoint_name: $(endpoint_name)
              deployment_name: $(batch_deployment_name)
              deployment_file: classical/aml-cli-v2/mlops/azureml/deploy/batch/batch-deployment.yml
          - template: templates/aml-cli-v2/test-deployment.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              endpoint_type: batch
              endpoint_name: $(endpoint_name)
              working_directory: $(System.DefaultWorkingDirectory)
              deployment_name: $(batch_deployment_name)
              sample_request: azureml:taxi-data@latest
              request_type: uri_file #either uri_folder or uri_file
