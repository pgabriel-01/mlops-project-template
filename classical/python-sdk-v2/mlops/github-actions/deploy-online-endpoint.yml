name: Deploy and test online endpoint

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and configuration to target
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]
      model_version:
        description: Registered model version
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.config.outputs.enable_managed_online_endpoint }}
      resource_group: ${{ steps.config.outputs.resource_group }}
      workspace_name: ${{ steps.config.outputs.workspace_name }}
      endpoint_name: ${{ steps.config.outputs.online_endpoint_name }}
      deployment_name: ${{ steps.config.outputs.online_deployment_name }}
      alternate_deployment_name: ${{ steps.config.outputs.online_alternate_deployment_name }}
      traffic_percentage: ${{ steps.config.outputs.online_traffic_percentage }}
      lock_container_name: ${{ steps.config.outputs.online_lock_container_name }}
      model_name: ${{ steps.config.outputs.model_name }}
      instance_type: ${{ steps.config.outputs.online_instance_type }}
      instance_count: ${{ steps.config.outputs.online_instance_count }}
      mlflow_no_code: ${{ steps.config.outputs.online_mlflow_no_code }}
      environment_name: ${{ steps.config.outputs.online_environment_name }}
      environment_version: ${{ steps.config.outputs.online_environment_version }}
      environment_image: ${{ steps.config.outputs.online_environment_image }}
      code_directory: ${{ steps.config.outputs.online_code_directory }}
      scoring_script: ${{ steps.config.outputs.online_scoring_script }}
      endpoint_identity_name: ${{ steps.config.outputs.online_endpoint_identity_name }}
      python_version: ${{ steps.config.outputs.python_version }}
      runner: ${{ steps.config.outputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: config
        run: python3 mlops/scripts/export_config.py config-infra-${{ inputs.environment }}.yml

  deploy:
    needs: config
    if: needs.config.outputs.enabled == 'true'
    runs-on: ${{ needs.config.outputs.runner }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ needs.config.outputs.python_version }}
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Azure ML tooling
        run: |
          python -m pip install --disable-pip-version-check \
            -r mlops/azureml/deploy/online/requirements.txt
          az extension add --name ml --version 2.44.1 --upgrade --yes
      - name: Provision the workspace managed network
        run: |
          az ml workspace provision-network \
            --resource-group "${{ needs.config.outputs.resource_group }}" \
            --name "${{ needs.config.outputs.workspace_name }}" \
            --include-spark false
      - name: Deploy and test private managed endpoint
        env:
          MLFLOW_NO_CODE: ${{ needs.config.outputs.mlflow_no_code }}
        run: |
          endpoint_identity_id="$(
            az identity show \
              --resource-group "${{ needs.config.outputs.resource_group }}" \
              --name "${{ needs.config.outputs.endpoint_identity_name }}" \
              --query id \
              --output tsv
          )"
          lock_storage_account_id="$(
            az resource show \
              --resource-group "${{ needs.config.outputs.resource_group }}" \
              --name "${{ needs.config.outputs.workspace_name }}" \
              --resource-type Microsoft.MachineLearningServices/workspaces \
              --query properties.storageAccount \
              --output tsv
          )"
          lock_storage_account_name="${lock_storage_account_id##*/}"
          mode_args=()
          if [[ "$MLFLOW_NO_CODE" == "true" ]]; then
            mode_args+=(--mlflow-no-code)
          else
            mode_args+=(
              --environment-name "${{ needs.config.outputs.environment_name }}"
              --environment-version "${{ needs.config.outputs.environment_version }}"
              --environment-image "${{ needs.config.outputs.environment_image }}"
              --code-directory "${{ needs.config.outputs.code_directory }}"
              --scoring-script "${{ needs.config.outputs.scoring_script }}"
            )
          fi
          python mlops/azureml/deploy/online/deploy.py \
            --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ needs.config.outputs.resource_group }}" \
            --workspace-name "${{ needs.config.outputs.workspace_name }}" \
            --endpoint-name "${{ needs.config.outputs.endpoint_name }}" \
            --deployment-name "${{ needs.config.outputs.deployment_name }}" \
            --alternate-deployment-name "${{ needs.config.outputs.alternate_deployment_name }}" \
            --traffic-percentage "${{ needs.config.outputs.traffic_percentage }}" \
            --lock-storage-account-name "$lock_storage_account_name" \
            --lock-container-name "${{ needs.config.outputs.lock_container_name }}" \
            --endpoint-identity-resource-id "$endpoint_identity_id" \
            --model-name "${{ needs.config.outputs.model_name }}" \
            --model-version "${{ inputs.model_version }}" \
            --instance-type "${{ needs.config.outputs.instance_type }}" \
            --instance-count "${{ needs.config.outputs.instance_count }}" \
            --request-file data/taxi-request.json \
            "${mode_args[@]}"
