name: deploy-online-endpoint-pipeline

variables:
  - template: ../../../../config-infra-dev.yml
  - name: endpoint_name
    value: $(online_endpoint_name)
  - name: endpoint_type
    value: online

trigger: none

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: mlops-templates # Template Repo
      name: mlops-templates
      type: git
      ref: ${{ variables.mlops_templates_ref }}

stages:
  - stage: CreateOnlineEndpoint
    displayName: Create/Update Online Endpoint
    jobs:
      - job: DeployOnlineEndpoint
        steps:
          - checkout: self
            path: s/
          - template: templates/aml-cli-v2/setup.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              working_directory: $(System.DefaultWorkingDirectory)
          - template: templates/aml-cli-v2/create-endpoint.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              endpoint_type: online
              endpoint_name: $(endpoint_name)
              endpoint_file: classical/aml-cli-v2/mlops/azureml/deploy/online/online-endpoint.yml
          - template: templates/aml-cli-v2/create-deployment.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              endpoint_type: online
              endpoint_name: $(endpoint_name)
              deployment_name: $(online_deployment_name)
              deployment_file: classical/aml-cli-v2/mlops/azureml/deploy/online/online-deployment.yml
          - template: templates/aml-cli-v2/allocate-traffic.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              endpoint_name: $(endpoint_name)
              traffic_allocation: $(online_deployment_name)=100
          - template: templates/aml-cli-v2/test-deployment.yml@mlops-templates
            parameters:
              azure_service_connection: $(ado_service_connection_aml_ws)
              resource_group: $(resource_group)
              workspace_name: $(aml_workspace)
              endpoint_type: online
              endpoint_name: $(endpoint_name)
              working_directory: $(System.DefaultWorkingDirectory)
              deployment_name: $(online_deployment_name)
              sample_request: classical/aml-cli-v2/data/taxi-request.json
              request_type: json
