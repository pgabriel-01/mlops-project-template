name: Test Bicep Templates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - feature/**
    paths:
      - 'infrastructure/bicep/**'
  push:
    branches:
      - feature/**
    paths:
      - 'infrastructure/bicep/**'

jobs:
  test-bicep:
    name: Test Bicep Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az version

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Lint Bicep Files
        run: |
          echo "Linting main.bicep..."
          az bicep build --file ./infrastructure/bicep/main.bicep
          
          echo "Linting all module files..."
          for file in infrastructure/bicep/modules/*.bicep; do
            echo "Linting $file..."
            az bicep build --file "$file"
          done

      - name: Test Bicep Build
        run: |
          echo "Building main Bicep template..."
          az bicep build --file ./infrastructure/bicep/main.bicep --outfile ./main-test.json
          echo "✓ Build successful!"
          
          echo "Checking generated ARM template..."
          cat ./main-test.json | jq '.resources | length'

      - name: Validate Bicep Syntax (What-If)
        if: github.event_name == 'pull_request'
        run: |
          echo "This is a PR - performing dry-run validation only"
          echo "In a real deployment, you would run:"
          echo "az deployment sub validate --location <location> --template-file ./infrastructure/bicep/main.bicep"
          
      - name: Check for Common Issues
        run: |
          echo "Checking for hard-coded values..."
          if grep -r "eastus\|westus" infrastructure/bicep/*.bicep; then
            echo "⚠️  Warning: Hard-coded region found. Consider using parameters."
          else
            echo "✓ No hard-coded regions found"
          fi
          
          echo "Checking parameter usage..."
          if grep -r "@secure()" infrastructure/bicep/*.bicep; then
            echo "✓ Secure parameters found"
          fi

      - name: Summary
        run: |
          echo "### Bicep Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "✓ All Bicep templates compiled successfully" >> $GITHUB_STEP_SUMMARY
          echo "✓ Syntax validation passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files validated:**" >> $GITHUB_STEP_SUMMARY
          echo "- main.bicep" >> $GITHUB_STEP_SUMMARY
          for file in infrastructure/bicep/modules/*.bicep; do
            echo "- $(basename $file)" >> $GITHUB_STEP_SUMMARY
          done
