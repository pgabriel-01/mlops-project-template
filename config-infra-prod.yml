# Prod environment — env-specific overrides.
# Organization-specific values are supplied by the mlops-prod variable group.
# Required variables:
# - ado_service_connection_rg
# - ado_service_connection_aml_ws
# - cicd_principal_object_id
# - devops_infrastructure_principal_object_id
# - devcenter_project_resource_id
variables:
  - template: config-infra-common.yml
  - group: mlops-prod

  # Environment-specific
  - name: postfix
    value: 70001
  - name: location
    value: eastus
  - name: environment
    value: prod
  - name: deployment_environment
    value: prod
  - name: network_mode
    value: private
  - name: variable_group_name
    value: mlops-prod
  - name: enable_private_endpoints
    value: true
  - name: platform_service_connection_name
    value: $(ado_service_connection_rg)
  - name: workload_service_connection_name
    value: $(ado_service_connection_aml_ws)
