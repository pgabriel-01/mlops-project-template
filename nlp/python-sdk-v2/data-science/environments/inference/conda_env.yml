# NLP Inference Environment - Updated January 2026
name: nlp_inference_conda_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  - cpuonly  # Use CPU for inference, change to cudatoolkit for GPU
  - pip:
      - azure-ai-ml==1.31.0
      - mlflow==2.22.4
      - transformers==4.47.0
      - 'inference-schema[numpy-support]==1.5.1'
      - applicationinsights==0.11.10
      - numpy<2
