name: Bicep - Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - main
      - develop
    paths:
      - 'infrastructure/bicep/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infrastructure/bicep/**'

permissions:
  id-token: write
  contents: read

env:
  BICEP_FILE: './infrastructure/bicep/main.bicep'

jobs:
  lint:
    name: Lint Bicep Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Lint Bicep
        run: |
          az bicep build --file ${{ env.BICEP_FILE }}

  validate:
    name: Validate Bicep Deployment
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    outputs:
      sp_object_id: ${{ steps.get_sp_info.outputs.sp_object_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load Configuration
        id: config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "Loading production configuration"
            CONFIG_FILE="config-infra-prod.yml"
          else
            echo "Loading dev configuration"
            CONFIG_FILE="config-infra-dev.yml"
          fi
          
          # Parse YAML config (simple example - adjust based on your config structure)
          # Read shared values from common config
          COMMON_FILE="config-infra-common.yml"
          PREFIX=$(yq eval '.variables.namespace' $COMMON_FILE)
          AML_COMPUTE_SKU=$(yq eval '.variables.aml_compute_sku' $COMMON_FILE)
          ENABLE_MONITORING=$(yq eval '.variables.enable_monitoring' $COMMON_FILE)
          ENABLE_CR=$(yq eval '.variables.enable_container_registry' $COMMON_FILE)
          ENABLE_COMPUTE=$(yq eval '.variables.enable_aml_computecluster' $COMMON_FILE)
          TAG_COST_CENTER=$(yq eval '.variables.tag_cost_center' $COMMON_FILE)
          TAG_MANAGED_BY=$(yq eval '.variables.tag_managed_by' $COMMON_FILE)
          
          # Read env-specific overrides (array format: - name: key / value: val)
          LOCATION=$(yq eval '.variables[] | select(.name == "location") | .value' $CONFIG_FILE)
          POSTFIX=$(yq eval '.variables[] | select(.name == "postfix") | .value' $CONFIG_FILE)
          ENV=$(yq eval '.variables[] | select(.name == "environment") | .value' $CONFIG_FILE)
          
          echo "location=$LOCATION" >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "postfix=$POSTFIX" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "aml_compute_sku=$AML_COMPUTE_SKU" >> $GITHUB_OUTPUT
          echo "enable_monitoring=$ENABLE_MONITORING" >> $GITHUB_OUTPUT
          echo "enable_container_registry=$ENABLE_CR" >> $GITHUB_OUTPUT
          echo "enable_compute_cluster=$ENABLE_COMPUTE" >> $GITHUB_OUTPUT
          echo "enable_vnet=$ENABLE_VNET" >> $GITHUB_OUTPUT
          echo "vnet_address_prefix=$VNET_PREFIX" >> $GITHUB_OUTPUT
          echo "default_subnet_prefix=$DEFAULT_SUBNET" >> $GITHUB_OUTPUT
          echo "compute_subnet_prefix=$COMPUTE_SUBNET" >> $GITHUB_OUTPUT
          echo "pe_subnet_prefix=$PE_SUBNET" >> $GITHUB_OUTPUT
          echo "tag_cost_center=$TAG_COST_CENTER" >> $GITHUB_OUTPUT
          echo "tag_managed_by=$TAG_MANAGED_BY" >> $GITHUB_OUTPUT
          ENABLE_CMEK=$(yq eval '.variables.enable_cmek' $COMMON_FILE)
          ENABLE_DEFENDER=$(yq eval '.variables.enable_defender' $COMMON_FILE)
          PROJECT_NUMBER=$(yq eval '.variables.project_number' $COMMON_FILE)
          TEAM_LEAD_GROUP=$(yq eval '.variables.team_lead_group_id' $COMMON_FILE)
          DS_GROUP=$(yq eval '.variables.data_scientist_group_id' $COMMON_FILE)
          MLE_GROUP=$(yq eval '.variables.ml_engineer_group_id' $COMMON_FILE)
          echo "enable_cmek=$ENABLE_CMEK" >> $GITHUB_OUTPUT
          echo "enable_defender=$ENABLE_DEFENDER" >> $GITHUB_OUTPUT
          echo "project_number=$PROJECT_NUMBER" >> $GITHUB_OUTPUT
          echo "team_lead_group_id=$TEAM_LEAD_GROUP" >> $GITHUB_OUTPUT
          echo "data_scientist_group_id=$DS_GROUP" >> $GITHUB_OUTPUT
          echo "ml_engineer_group_id=$MLE_GROUP" >> $GITHUB_OUTPUT
          ENABLE_AI_FOUNDRY=$(yq eval '.variables.enable_ai_foundry' $COMMON_FILE)
          ENABLE_APIM=$(yq eval '.variables.enable_api_management' $COMMON_FILE)
          KV_ENABLE_PURGE=$(yq eval '.variables.kv_enable_purge_protection' $COMMON_FILE)
          echo "enable_ai_foundry=$ENABLE_AI_FOUNDRY" >> $GITHUB_OUTPUT
          echo "enable_api_management=$ENABLE_APIM" >> $GITHUB_OUTPUT
          echo "kv_enable_purge_protection=$KV_ENABLE_PURGE" >> $GITHUB_OUTPUT

      - name: Get Service Principal Object ID
        id: get_sp_info
        run: |
          # Use AZURE_CLIENT_ID directly (OIDC authentication)
          SP_APP_ID="${{ secrets.AZURE_CLIENT_ID }}"
          SP_OBJECT_ID=$(az ad sp show --id $SP_APP_ID --query id -o tsv)
          
          echo "Service Principal App ID: $SP_APP_ID"
          echo "Service Principal Object ID: $SP_OBJECT_ID"
          echo "sp_object_id=$SP_OBJECT_ID" >> $GITHUB_OUTPUT

      - name: Validate Bicep Deployment
        run: |
          az deployment sub validate \
            --name "bicep-gha-${{ github.run_number }}" \
            --location ${{ steps.config.outputs.location }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters \
              location=${{ steps.config.outputs.location }} \
              prefix=${{ steps.config.outputs.prefix }} \
              postfix=${{ steps.config.outputs.postfix }} \
              env=${{ steps.config.outputs.environment }} \
              adoServicePrincipalId=${{ steps.get_sp_info.outputs.sp_object_id }} \
              amlComputeSku=${{ steps.config.outputs.aml_compute_sku }} \
              enableMonitoring=${{ steps.config.outputs.enable_monitoring }} \
              enableContainerRegistry=${{ steps.config.outputs.enable_container_registry }} \
              enableComputeCluster=${{ steps.config.outputs.enable_compute_cluster }} \
              enableVNet=${{ steps.config.outputs.enable_vnet }} \
              vnetAddressPrefix='${{ steps.config.outputs.vnet_address_prefix }}' \
              defaultSubnetPrefix='${{ steps.config.outputs.default_subnet_prefix }}' \
              computeSubnetPrefix='${{ steps.config.outputs.compute_subnet_prefix }}' \
              peSubnetPrefix='${{ steps.config.outputs.pe_subnet_prefix }}' \
              tagCostCenter='${{ steps.config.outputs.tag_cost_center }}' \
              tagManagedBy='${{ steps.config.outputs.tag_managed_by }}' \
              enableCMEK=${{ steps.config.outputs.enable_cmek }} \
              enableDefender=${{ steps.config.outputs.enable_defender }} \
              projectNumber='${{ steps.config.outputs.project_number }}' \
              teamLeadGroupId='${{ steps.config.outputs.team_lead_group_id }}' \
              dataScientistGroupId='${{ steps.config.outputs.data_scientist_group_id }}' \
              mlEngineerGroupId='${{ steps.config.outputs.ml_engineer_group_id }}' \
              enableAIFoundry=${{ steps.config.outputs.enable_ai_foundry }} \
              enableAPIManagement=${{ steps.config.outputs.enable_api_management }} \
              kvEnablePurgeProtection=${{ steps.config.outputs.kv_enable_purge_protection }}

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [lint, validate]
    if: github.event_name != 'pull_request'
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load Configuration
        id: config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "Loading production configuration"
            CONFIG_FILE="config-infra-prod.yml"
          else
            echo "Loading dev configuration"
            CONFIG_FILE="config-infra-dev.yml"
          fi
          
          # Parse YAML config
          # Read shared values from common config
          COMMON_FILE="config-infra-common.yml"
          PREFIX=$(yq eval '.variables.namespace' $COMMON_FILE)
          AML_COMPUTE_SKU=$(yq eval '.variables.aml_compute_sku' $COMMON_FILE)
          ENABLE_MONITORING=$(yq eval '.variables.enable_monitoring' $COMMON_FILE)
          ENABLE_CR=$(yq eval '.variables.enable_container_registry' $COMMON_FILE)
          ENABLE_COMPUTE=$(yq eval '.variables.enable_aml_computecluster' $COMMON_FILE)
          ENABLE_VNET=$(yq eval '.variables.enable_vnet' $COMMON_FILE)
          VNET_PREFIX=$(yq eval '.variables.vnet_address_prefix' $COMMON_FILE)
          DEFAULT_SUBNET=$(yq eval '.variables.default_subnet_prefix' $COMMON_FILE)
          COMPUTE_SUBNET=$(yq eval '.variables.compute_subnet_prefix' $COMMON_FILE)
          PE_SUBNET=$(yq eval '.variables.pe_subnet_prefix' $COMMON_FILE)
          TAG_COST_CENTER=$(yq eval '.variables.tag_cost_center' $COMMON_FILE)
          TAG_MANAGED_BY=$(yq eval '.variables.tag_managed_by' $COMMON_FILE)
          
          # Read env-specific overrides (array format: - name: key / value: val)
          LOCATION=$(yq eval '.variables[] | select(.name == "location") | .value' $CONFIG_FILE)
          POSTFIX=$(yq eval '.variables[] | select(.name == "postfix") | .value' $CONFIG_FILE)
          ENV=$(yq eval '.variables[] | select(.name == "environment") | .value' $CONFIG_FILE)
          
          echo "location=$LOCATION" >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "postfix=$POSTFIX" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "aml_compute_sku=$AML_COMPUTE_SKU" >> $GITHUB_OUTPUT
          echo "enable_monitoring=$ENABLE_MONITORING" >> $GITHUB_OUTPUT
          echo "enable_container_registry=$ENABLE_CR" >> $GITHUB_OUTPUT
          echo "enable_compute_cluster=$ENABLE_COMPUTE" >> $GITHUB_OUTPUT
          echo "enable_vnet=$ENABLE_VNET" >> $GITHUB_OUTPUT
          echo "vnet_address_prefix=$VNET_PREFIX" >> $GITHUB_OUTPUT
          echo "default_subnet_prefix=$DEFAULT_SUBNET" >> $GITHUB_OUTPUT
          echo "compute_subnet_prefix=$COMPUTE_SUBNET" >> $GITHUB_OUTPUT
          echo "pe_subnet_prefix=$PE_SUBNET" >> $GITHUB_OUTPUT
          echo "tag_cost_center=$TAG_COST_CENTER" >> $GITHUB_OUTPUT
          echo "tag_managed_by=$TAG_MANAGED_BY" >> $GITHUB_OUTPUT
          ENABLE_CMEK=$(yq eval '.variables.enable_cmek' $COMMON_FILE)
          ENABLE_DEFENDER=$(yq eval '.variables.enable_defender' $COMMON_FILE)
          PROJECT_NUMBER=$(yq eval '.variables.project_number' $COMMON_FILE)
          TEAM_LEAD_GROUP=$(yq eval '.variables.team_lead_group_id' $COMMON_FILE)
          DS_GROUP=$(yq eval '.variables.data_scientist_group_id' $COMMON_FILE)
          MLE_GROUP=$(yq eval '.variables.ml_engineer_group_id' $COMMON_FILE)
          echo "enable_cmek=$ENABLE_CMEK" >> $GITHUB_OUTPUT
          echo "enable_defender=$ENABLE_DEFENDER" >> $GITHUB_OUTPUT
          echo "project_number=$PROJECT_NUMBER" >> $GITHUB_OUTPUT
          echo "team_lead_group_id=$TEAM_LEAD_GROUP" >> $GITHUB_OUTPUT
          echo "data_scientist_group_id=$DS_GROUP" >> $GITHUB_OUTPUT
          echo "ml_engineer_group_id=$MLE_GROUP" >> $GITHUB_OUTPUT
          ENABLE_AI_FOUNDRY=$(yq eval '.variables.enable_ai_foundry' $COMMON_FILE)
          ENABLE_APIM=$(yq eval '.variables.enable_api_management' $COMMON_FILE)
          KV_ENABLE_PURGE=$(yq eval '.variables.kv_enable_purge_protection' $COMMON_FILE)
          echo "enable_ai_foundry=$ENABLE_AI_FOUNDRY" >> $GITHUB_OUTPUT
          echo "enable_api_management=$ENABLE_APIM" >> $GITHUB_OUTPUT
          echo "kv_enable_purge_protection=$KV_ENABLE_PURGE" >> $GITHUB_OUTPUT

      - name: Get Service Principal Object ID
        id: get_sp_info
        run: |
          # Use AZURE_CLIENT_ID directly (OIDC authentication)
          SP_APP_ID="${{ secrets.AZURE_CLIENT_ID }}"
          SP_OBJECT_ID=$(az ad sp show --id $SP_APP_ID --query id -o tsv)
          
          echo "Service Principal App ID: $SP_APP_ID"
          echo "Service Principal Object ID: $SP_OBJECT_ID"
          echo "sp_object_id=$SP_OBJECT_ID" >> $GITHUB_OUTPUT

      - name: Deploy Bicep Template
        run: |
          echo "Deploying to ${{ steps.config.outputs.environment }} environment..."
          
          az deployment sub create \
            --name "bicep-gha-${{ github.run_number }}" \
            --location ${{ steps.config.outputs.location }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters \
              location=${{ steps.config.outputs.location }} \
              prefix=${{ steps.config.outputs.prefix }} \
              postfix=${{ steps.config.outputs.postfix }} \
              env=${{ steps.config.outputs.environment }} \
              adoServicePrincipalId=${{ steps.get_sp_info.outputs.sp_object_id }} \
              amlComputeSku=${{ steps.config.outputs.aml_compute_sku }} \
              enableMonitoring=${{ steps.config.outputs.enable_monitoring }} \
              enableContainerRegistry=${{ steps.config.outputs.enable_container_registry }} \
              enableComputeCluster=${{ steps.config.outputs.enable_compute_cluster }} \
              enableVNet=${{ steps.config.outputs.enable_vnet }} \
              vnetAddressPrefix='${{ steps.config.outputs.vnet_address_prefix }}' \
              defaultSubnetPrefix='${{ steps.config.outputs.default_subnet_prefix }}' \
              computeSubnetPrefix='${{ steps.config.outputs.compute_subnet_prefix }}' \
              peSubnetPrefix='${{ steps.config.outputs.pe_subnet_prefix }}' \
              tagCostCenter='${{ steps.config.outputs.tag_cost_center }}' \
              tagManagedBy='${{ steps.config.outputs.tag_managed_by }}' \
              enableCMEK=${{ steps.config.outputs.enable_cmek }} \
              enableDefender=${{ steps.config.outputs.enable_defender }} \
              projectNumber='${{ steps.config.outputs.project_number }}' \
              teamLeadGroupId='${{ steps.config.outputs.team_lead_group_id }}' \
              dataScientistGroupId='${{ steps.config.outputs.data_scientist_group_id }}' \
              mlEngineerGroupId='${{ steps.config.outputs.ml_engineer_group_id }}' \
              enableAIFoundry=${{ steps.config.outputs.enable_ai_foundry }} \
              enableAPIManagement=${{ steps.config.outputs.enable_api_management }} \
              kvEnablePurgeProtection=${{ steps.config.outputs.kv_enable_purge_protection }}

      - name: Output Deployment Results
        run: |
          echo "Deployment completed successfully!"
          az deployment sub show \
            --name "bicep-gha-${{ github.run_number }}" \
            --query properties.outputs
