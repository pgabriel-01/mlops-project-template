name: deploy-private-managed-online-infrastructure

trigger: none
pr: none
lockBehavior: sequential

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - test
      - prod
  - name: deploy
    displayName: Deploy after validation
    type: boolean
    default: false
  - name: privateAgentPool
    displayName: Private self-hosted Linux agent pool
    type: string
    default: REQUIRED_PRIVATE_SELF_HOSTED_POOL
  - name: azureServiceConnection
    displayName: Workload identity service connection
    type: string
    default: REQUIRED_WORKLOAD_IDENTITY_SERVICE_CONNECTION
  - name: azurePrincipalObjectId
    displayName: Workload identity service principal object ID
    type: string
    default: REQUIRED_CANONICAL_OBJECT_ID
  - name: devJumpboxLoginGroupId
    displayName: Optional Dev jumpbox Entra login group object ID
    type: string
    default: ''

stages:
  - stage: ValidateInfrastructure
    displayName: Validate private infrastructure
    jobs:
      - job: Validate
        pool:
          name: ${{ parameters.privateAgentPool }}
          demands:
            - Agent.OS -equals Linux
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              case "$PRIVATE_AGENT_POOL" in
                REQUIRED_PRIVATE_SELF_HOSTED_POOL|Azure\ Pipelines|Default)
                  echo "A named private self-hosted Linux agent pool is required." >&2
                  exit 2
                  ;;
              esac
              python3 mlops/scripts/export_config.py \
                "config-infra-${{ parameters.environment }}.yml" \
                --azure-devops
            displayName: Validate private pool and load configuration
            env:
              PRIVATE_AGENT_POOL: ${{ parameters.privateAgentPool }}
          - task: AzureCLI@2
            displayName: Validate Bicep deployment
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                [[ -n "${idToken:-}" ]] || {
                  echo "The Azure service connection must use workload identity federation." >&2
                  exit 2
                }
                python3 mlops/scripts/check_shared_private_dns.py \
                  "config-infra-${{ parameters.environment }}.yml"
                if [[ "$(enable_dev_jumpbox)" == "true" ]]; then
                  base_name="$(resource_group)"
                  python3 mlops/scripts/check_legacy_bastion.py \
                    --resource-group "$(resource_group)" \
                    --base-name "${base_name#rg-}"
                  az vm image show \
                    --location "$(location)" \
                    --urn "Canonical:ubuntu-24_04-lts:server:$(dev_jumpbox_ubuntu_image_version)" \
                    --only-show-errors \
                    --output none
                fi
                python3 mlops/scripts/render_bicep_parameters.py \
                  "config-infra-${{ parameters.environment }}.yml" \
                  infrastructure/parameters.json
                az bicep build --file infrastructure/main.bicep
                az deployment sub validate \
                  --name "mlops-validate-$(Build.BuildId)" \
                  --location "$(location)" \
                  --template-file infrastructure/main.bicep \
                  --parameters @infrastructure/parameters.json
            env:
              AZURE_PRINCIPAL_OBJECT_ID: ${{ parameters.azurePrincipalObjectId }}
              DEV_JUMPBOX_LOGIN_GROUP_ID: ${{ parameters.devJumpboxLoginGroupId }}

  - stage: DeployInfrastructure
    displayName: Deploy private infrastructure
    dependsOn: ValidateInfrastructure
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))
    jobs:
      - deployment: Deploy
        environment: ${{ parameters.environment }}
        pool:
          name: ${{ parameters.privateAgentPool }}
          demands:
            - Agent.OS -equals Linux
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - bash: |
                    set -euo pipefail
                    case "$PRIVATE_AGENT_POOL" in
                      REQUIRED_PRIVATE_SELF_HOSTED_POOL|Azure\ Pipelines|Default)
                        echo "A named private self-hosted Linux agent pool is required." >&2
                        exit 2
                        ;;
                    esac
                    python3 mlops/scripts/export_config.py \
                      "config-infra-${{ parameters.environment }}.yml" \
                      --azure-devops
                  displayName: Validate private pool and load configuration
                  env:
                    PRIVATE_AGENT_POOL: ${{ parameters.privateAgentPool }}
                - task: AzureCLI@2
                  displayName: Deploy Bicep
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      [[ -n "${idToken:-}" ]] || {
                        echo "The Azure service connection must use workload identity federation." >&2
                        exit 2
                      }
                      python3 mlops/scripts/check_shared_private_dns.py \
                        "config-infra-${{ parameters.environment }}.yml"
                      if [[ "$(enable_dev_jumpbox)" == "true" ]]; then
                        base_name="$(resource_group)"
                        python3 mlops/scripts/check_legacy_bastion.py \
                          --resource-group "$(resource_group)" \
                          --base-name "${base_name#rg-}"
                      fi
                      python3 mlops/scripts/render_bicep_parameters.py \
                        "config-infra-${{ parameters.environment }}.yml" \
                        infrastructure/parameters.json
                      if [[ "$(enable_vnet)" == "true" ]] && \
                         [[ "$(enable_compute_cluster)" == "true" ]]; then
                        az deployment sub create \
                          --name "mlops-base-${{ parameters.environment }}-$(Build.BuildId)" \
                          --location "$(location)" \
                          --template-file infrastructure/main.bicep \
                          --parameters @infrastructure/parameters.json enableComputeCluster=false
                        az extension add --name ml --version 2.44.1 --upgrade --yes
                        python3 mlops/scripts/provision_workspace_network.py \
                          --resource-group "$(resource_group)" \
                          --workspace-name "$(workspace_name)"
                      fi
                      az deployment sub create \
                        --name "mlops-${{ parameters.environment }}-$(Build.BuildId)" \
                        --location "$(location)" \
                        --template-file infrastructure/main.bicep \
                        --parameters @infrastructure/parameters.json
                  env:
                    AZURE_PRINCIPAL_OBJECT_ID: ${{ parameters.azurePrincipalObjectId }}
                    DEV_JUMPBOX_LOGIN_GROUP_ID: ${{ parameters.devJumpboxLoginGroupId }}
