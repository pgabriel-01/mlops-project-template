name: Deploy infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-infrastructure.yml"
      - "config-infra-*.yml"
      - "infrastructure/**"
      - "mlops/scripts/render_bicep_parameters.py"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and configuration to target
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]
      deploy:
        description: Deploy after validation
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.select.outputs.environment }}
      location: ${{ steps.config.outputs.location }}
      runner: ${{ steps.config.outputs.runner }}
      private_aks_inference: ${{ steps.config.outputs.enable_private_aks_inference }}
      ssl_cname: ${{ steps.config.outputs.aml_kubernetes_extension_ssl_cname }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: select
        env:
          SELECTED_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'dev' || inputs.environment }}
        run: echo "environment=$SELECTED_ENVIRONMENT" >> "$GITHUB_OUTPUT"
      - id: config
        run: python3 mlops/scripts/export_config.py config-infra-${{ steps.select.outputs.environment }}.yml

  lint:
    needs: config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: az bicep build --file infrastructure/main.bicep

  validate:
    needs: [config, lint]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.config.outputs.runner }}
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Load configuration
        env:
          AZURE_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
        run: |
          python3 mlops/scripts/render_bicep_parameters.py \
            config-infra-${{ needs.config.outputs.environment }}.yml \
            infrastructure/parameters.json
      - name: Validate deployment
        env:
          PRIVATE_AKS_INFERENCE: ${{ needs.config.outputs.private_aks_inference }}
          SSL_CNAME: ${{ needs.config.outputs.ssl_cname }}
          TLS_CERT_PEM: ${{ secrets.AML_KUBERNETES_EXTENSION_TLS_CERT_PEM }}
          TLS_KEY_PEM: ${{ secrets.AML_KUBERNETES_EXTENSION_TLS_KEY_PEM }}
        run: |
          if [[ "$PRIVATE_AKS_INFERENCE" == "true" && ( -z "$TLS_CERT_PEM" || -z "$TLS_KEY_PEM" ) ]]; then
            echo "AML Kubernetes TLS certificate and key GitHub Environment secrets are required" >&2
            exit 1
          fi
          if [[ "$PRIVATE_AKS_INFERENCE" == "true" ]]; then
            printf '%s' "$TLS_CERT_PEM" | openssl x509 -noout -ext subjectAltName | grep -q 'DNS:'
            printf '%s' "$TLS_CERT_PEM" | openssl x509 -noout -checkhost "$SSL_CNAME"
          fi
          az deployment sub validate \
            --name "mlops-validate-${{ github.run_id }}" \
            --location "${{ needs.config.outputs.location }}" \
            --template-file infrastructure/main.bicep \
            --parameters @infrastructure/parameters.json \
            --parameters amlKubernetesExtensionTlsCertPem="$TLS_CERT_PEM" \
                         amlKubernetesExtensionTlsKeyPem="$TLS_KEY_PEM"

  deploy:
    needs: [config, validate]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ${{ needs.config.outputs.runner }}
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Load configuration
        env:
          AZURE_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
        run: |
          python3 mlops/scripts/render_bicep_parameters.py \
            config-infra-${{ needs.config.outputs.environment }}.yml \
            infrastructure/parameters.json
      - name: Deploy infrastructure
        env:
          PRIVATE_AKS_INFERENCE: ${{ needs.config.outputs.private_aks_inference }}
          SSL_CNAME: ${{ needs.config.outputs.ssl_cname }}
          TLS_CERT_PEM: ${{ secrets.AML_KUBERNETES_EXTENSION_TLS_CERT_PEM }}
          TLS_KEY_PEM: ${{ secrets.AML_KUBERNETES_EXTENSION_TLS_KEY_PEM }}
        run: |
          if [[ "$PRIVATE_AKS_INFERENCE" == "true" && ( -z "$TLS_CERT_PEM" || -z "$TLS_KEY_PEM" ) ]]; then
            echo "AML Kubernetes TLS certificate and key GitHub Environment secrets are required" >&2
            exit 1
          fi
          if [[ "$PRIVATE_AKS_INFERENCE" == "true" ]]; then
            printf '%s' "$TLS_CERT_PEM" | openssl x509 -noout -ext subjectAltName | grep -q 'DNS:'
            printf '%s' "$TLS_CERT_PEM" | openssl x509 -noout -checkhost "$SSL_CNAME"
            bootstrap_outputs="$RUNNER_TEMP/private-aks-bootstrap-outputs.json"
            az deployment sub create \
              --name "mlops-${{ needs.config.outputs.environment }}-${{ github.run_id }}-bootstrap" \
              --location "${{ needs.config.outputs.location }}" \
              --template-file infrastructure/main.bicep \
              --parameters @infrastructure/parameters.json \
              --parameters completePrivateAksInferenceDeployment=false \
                           amlKubernetesExtensionTlsCertPem="$TLS_CERT_PEM" \
                           amlKubernetesExtensionTlsKeyPem="$TLS_KEY_PEM" \
              --query properties.outputs \
              --output json > "$bootstrap_outputs"

            aks_cluster_id="$(jq -er '.aksClusterId.value' "$bootstrap_outputs")"
            inference_client_id="$(jq -er '.onlineInferenceIdentityClientId.value' "$bootstrap_outputs")"
            inference_namespace="$(jq -er '.onlineNamespace.value' "$bootstrap_outputs")"
            legacy_assignment_id="$(jq -er '.legacyNamespaceBootstrapRoleAssignmentId.value' "$bootstrap_outputs")"
            aks_subscription="$(cut -d/ -f3 <<<"$aks_cluster_id")"
            aks_resource_group="$(cut -d/ -f5 <<<"$aks_cluster_id")"
            aks_name="$(cut -d/ -f9 <<<"$aks_cluster_id")"
            namespace_manifest="$RUNNER_TEMP/azureml-inference-namespace.yaml"

            python3 - "$inference_namespace" "$inference_client_id" "$namespace_manifest" <<'PY'
          import sys
          from pathlib import Path

          namespace, client_id, output_path = sys.argv[1:]
          content = Path(
              "infrastructure/manifests/azureml-inference-namespace.yaml"
          ).read_text()
          content = content.replace("__ONLINE_NAMESPACE__", namespace)
          content = content.replace(
              "__ONLINE_INFERENCE_IDENTITY_CLIENT_ID__",
              client_id,
          )
          if "__ONLINE_" in content:
              raise SystemExit("Namespace manifest placeholders were not resolved")
          Path(output_path).write_text(content)
          PY

            if az resource show \
              --ids "$legacy_assignment_id" \
              --api-version 2022-04-01 \
              --only-show-errors > /dev/null 2>&1; then
              az role assignment delete --ids "$legacy_assignment_id"
            fi
            if az resource show \
              --ids "$legacy_assignment_id" \
              --api-version 2022-04-01 \
              --only-show-errors > /dev/null 2>&1; then
              echo "Legacy workspace identity namespace bootstrap role assignment still exists" >&2
              exit 1
            fi

            bootstrap_succeeded=false
            for attempt in $(seq 1 12); do
              if python3 runner-bootstrap/scripts/invoke_aks_command.py \
                --subscription "$aks_subscription" \
                --resource-group "$aks_resource_group" \
                --name "$aks_name" \
                --file "$namespace_manifest" \
                --command "kubectl apply -f $(basename "$namespace_manifest")"; then
                bootstrap_succeeded=true
                break
              fi
              echo "AKS namespace bootstrap attempt $attempt failed; waiting for RBAC propagation" >&2
              sleep 10
            done
            if [[ "$bootstrap_succeeded" != "true" ]]; then
              echo "Unable to apply the Azure ML namespace contract through AKS Run Command" >&2
              exit 1
            fi
          fi
          az deployment sub create \
            --name "mlops-${{ needs.config.outputs.environment }}-${{ github.run_id }}" \
            --location "${{ needs.config.outputs.location }}" \
            --template-file infrastructure/main.bicep \
            --parameters @infrastructure/parameters.json \
            --parameters amlKubernetesExtensionTlsCertPem="$TLS_CERT_PEM" \
                         amlKubernetesExtensionTlsKeyPem="$TLS_KEY_PEM"
