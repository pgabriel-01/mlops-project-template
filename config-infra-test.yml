# Test environment — env-specific overrides
# Service connections, principal IDs, and other organization-specific values
# are supplied by the mlops-test Azure DevOps variable group.
# Required variables:
# - ado_service_connection_rg
# - ado_service_connection_aml_ws
# - cicd_principal_object_id
# - devops_infrastructure_principal_object_id
# - devcenter_project_resource_id
variables:
  - template: config-infra-common.yml
  - group: mlops-test

  - name: postfix
    value: 40001
  - name: location
    value: eastus2
  - name: environment
    value: test
  - name: deployment_environment
    value: test
  - name: network_mode
    value: private
  - name: variable_group_name
    value: mlops-test
  - name: enable_private_endpoints
    value: true
  - name: platform_service_connection_name
    value: $(ado_service_connection_rg)
  - name: workload_service_connection_name
    value: $(ado_service_connection_aml_ws)
