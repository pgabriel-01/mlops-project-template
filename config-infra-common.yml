# Common configuration shared across all environments
# Environment-specific values are in config-infra-dev.yml and config-infra-prod.yml
variables:
  # Global
  ap_vm_image: ubuntu-latest

  namespace: taxi #Note: A namespace with many characters will cause storage account creation to fail due to storage account names having a limit of 24 characters.
  enable_aml_computecluster: true
  enable_monitoring: true
  enable_container_registry: true
  enable_vnet: true
  aml_compute_sku: STANDARD_D2S_V3
  training_compute_name: cpu-cluster
  batch_compute_name: batch-cluster
  model_name: taxi-model
  training_environment_name: taxi-train-env
  training_data_name: taxi-data
  online_endpoint_name: taxi-online-$(namespace)$(postfix)$(project_number)$(environment)
  online_deployment_name: taxi-online-dp
  batch_endpoint_name: taxi-batch-$(namespace)$(postfix)$(project_number)$(environment)
  batch_deployment_name: taxi-batch-dp

  # VNet settings (only used when enable_vnet: true)
  vnet_address_prefix: '10.0.0.0/16'
  default_subnet_prefix: '10.0.0.0/24'
  compute_subnet_prefix: '10.0.1.0/24'
  pe_subnet_prefix: '10.0.2.0/24'

  # Terraform network isolation. Keep false for DEV unless the agent has
  # private DNS resolution and network access to the deployed resources.
  enable_private_endpoints: false
  vnet_address_space: '10.0.0.0/16'
  training_subnet_address_prefix: '10.0.0.0/24'
  endpoints_subnet_address_prefix: '10.0.1.0/24'

  # Bastion settings (only used when enable_bastion: true; requires enable_vnet)
  enable_bastion: true
  bastion_subnet_prefix: '10.0.3.0/26'

  # Tags
  tag_cost_center: ''
  tag_managed_by: bicep-ado

  # Tier 3 — Governance
  enable_cmek: false
  enable_defender: false
  enable_aml_registry: false
  kv_enable_purge_protection: false
  project_number: '001'
  # Persona RBAC — set to Entra ID group object IDs (leave empty to skip)
  team_lead_group_id: ''
  data_scientist_group_id: ''
  ml_engineer_group_id: ''

  # Tier 4 — GenAI / Agent patterns
  enable_ai_foundry: false
  enable_api_management: false

  # Endpoints
  oep: online-endpoint
  bep: batch-endpoint

  # DO NOT TOUCH

  # For pipeline reference (uses env-specific postfix and environment)
  resource_group: rg-$(namespace)-$(postfix)$(project_number)$(environment)
  aml_workspace: mlw-$(namespace)-$(postfix)$(project_number)$(environment)
  application_insights: mlw-$(namespace)-$(postfix)$(project_number)$(environment)
  key_vault: kv-$(namespace)-$(postfix)$(project_number)$(environment)
  container_registry: cr$(namespace)$(postfix)$(project_number)$(environment)
  storage_account: st$(namespace)$(postfix)$(project_number)$(environment)
  vnet_name: vnet-$(namespace)-$(postfix)$(project_number)$(environment)

  # For bicep reference
  bicep_workingdir: infrastructure/bicep
  bicep_template_file: main.bicep
  bicep_prefix: $(namespace)
  bicep_postfix: $(postfix)
  bicep_env: $(environment)
  bicep_location: $(location)
  bicep_ado_service_principal_id: '' # Set via pipeline variable or secret

  # For terraform reference
  terraform_version: 1.14.3
  terraform_workingdir: infrastructure/terraform
  terraform_st_location: $(location)
  terraform_st_resource_group: rg-$(namespace)-$(postfix)$(environment)-tf
  terraform_st_storage_account: st$(namespace)$(postfix)$(environment)tf
  terraform_st_container_name: default
  terraform_st_key: mlops-$(environment).tfstate

  # Pin the reusable templates. Replace only this value when a validated
  # mlops-templates release or implementation commit is available.
  mlops_templates_ref: 8dfb66dbd8c360063e0838ce616a9695a9a633fa

  # Object ID of the Azure-ARM service connection principal. Set as a
  # non-secret pipeline variable when Terraform should grant CI/CD RBAC.
  cicd_principal_object_id: ''
