replicaCount: 1

flags:
  logLevel: info
  logFormat: json
  runnerMaxConcurrentReconciles: 2
  updateStrategy: eventual

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
