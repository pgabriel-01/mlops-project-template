# Prod environment — env-specific overrides
# Shared values are in config-infra-common.yml
variables:
  - template: config-infra-common.yml

  # Environment-specific
  - name: postfix
    value: 70001
  - name: location
    value: eastus
  - name: environment
    value: prod

  # Azure DevOps service connections
  - name: ado_service_connection_rg
    value: Azure-ARM-Prod
  - name: ado_service_connection_aml_ws
    value: Azure-ARM-Prod
