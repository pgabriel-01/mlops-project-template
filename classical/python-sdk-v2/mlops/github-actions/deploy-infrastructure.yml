name: Deploy infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-infrastructure.yml"
      - "config-infra-*.yml"
      - "infrastructure/**"
      - "mlops/scripts/render_bicep_parameters.py"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and configuration to target
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]
      deploy:
        description: Deploy after validation
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.select.outputs.environment }}
      location: ${{ steps.config.outputs.location }}
      runner: ${{ steps.config.outputs.runner }}
      enable_dev_jumpbox: ${{ steps.config.outputs.enable_dev_jumpbox }}
      resource_group: ${{ steps.config.outputs.resource_group }}
      dev_jumpbox_ubuntu_image_version: ${{ steps.config.outputs.dev_jumpbox_ubuntu_image_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: select
        env:
          SELECTED_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'dev' || inputs.environment }}
        run: echo "environment=$SELECTED_ENVIRONMENT" >> "$GITHUB_OUTPUT"
      - id: config
        run: python3 mlops/scripts/export_config.py config-infra-${{ steps.select.outputs.environment }}.yml

  lint:
    needs: config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: az bicep build --file infrastructure/main.bicep

  validate:
    needs: [config, lint]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.config.outputs.runner }}
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check Dev jumpbox migration prerequisites
        if: needs.config.outputs.enable_dev_jumpbox == 'true'
        run: |
          base_name="${{ needs.config.outputs.resource_group }}"
          python3 mlops/scripts/check_legacy_bastion.py \
            --resource-group "${{ needs.config.outputs.resource_group }}" \
            --base-name "${base_name#rg-}"
          az vm image show \
            --location "${{ needs.config.outputs.location }}" \
            --urn "Canonical:ubuntu-24_04-lts:server:${{ needs.config.outputs.dev_jumpbox_ubuntu_image_version }}" \
            --only-show-errors \
            --output none
      - name: Load configuration
        env:
          AZURE_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
        run: |
          python3 mlops/scripts/render_bicep_parameters.py \
            config-infra-${{ needs.config.outputs.environment }}.yml \
            infrastructure/parameters.json
      - name: Validate deployment
        run: |
          az deployment sub validate \
            --name "mlops-validate-${{ github.run_id }}" \
            --location "${{ needs.config.outputs.location }}" \
            --template-file infrastructure/main.bicep \
            --parameters @infrastructure/parameters.json

  deploy:
    needs: [config, validate]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ${{ needs.config.outputs.runner }}
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check Dev jumpbox migration prerequisites
        if: needs.config.outputs.enable_dev_jumpbox == 'true'
        run: |
          base_name="${{ needs.config.outputs.resource_group }}"
          python3 mlops/scripts/check_legacy_bastion.py \
            --resource-group "${{ needs.config.outputs.resource_group }}" \
            --base-name "${base_name#rg-}"
          az vm image show \
            --location "${{ needs.config.outputs.location }}" \
            --urn "Canonical:ubuntu-24_04-lts:server:${{ needs.config.outputs.dev_jumpbox_ubuntu_image_version }}" \
            --only-show-errors \
            --output none
      - name: Load configuration
        env:
          AZURE_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
        run: |
          python3 mlops/scripts/render_bicep_parameters.py \
            config-infra-${{ needs.config.outputs.environment }}.yml \
            infrastructure/parameters.json
      - name: Deploy infrastructure
        run: |
          az deployment sub create \
            --name "mlops-${{ needs.config.outputs.environment }}-${{ github.run_id }}" \
            --location "${{ needs.config.outputs.location }}" \
            --template-file infrastructure/main.bicep \
            --parameters @infrastructure/parameters.json
