name: tf-ado-deploy-infra

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - test
      - prod
  - name: agentPoolName
    displayName: Agent pool override (empty uses environment default)
    type: string
    default: ''
  - name: mlopsTemplatesRef
    displayName: mlops-templates branch, tag, or commit
    type: string
    default: refs/heads/main

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
    - template: ../../../config-infra-dev.yml
  - ${{ if eq(parameters.environment, 'test') }}:
    - template: ../../../config-infra-test.yml
  - ${{ if eq(parameters.environment, 'prod') }}:
    - template: ../../../config-infra-prod.yml
  - name: selected_agent_pool
    value: ${{ coalesce(parameters.agentPoolName, variables.managed_devops_pool_alias) }}

trigger: none

pool:
  name: $(selected_agent_pool)

resources:
  repositories:
    - repository: mlops-templates
      name: mlops-templates
      type: git
      ref: ${{ parameters.mlopsTemplatesRef }}

stages:
  - stage: DeployAzureMachineLearning
    displayName: Deploy Azure Machine Learning
    jobs:
      - job: DeployAzureMachineLearning
        displayName: Deploy Terraform
        steps:
          - checkout: self
            path: s/
          - template: templates/infra/terraform-deploy.yml@mlops-templates
            parameters:
              azureServiceConnection: $(ado_service_connection_rg)
              terraformVersion: $(terraform_version)
              workingDirectory: $(System.DefaultWorkingDirectory)/$(terraform_workingdir)
              backendResourceGroup: $(terraform_st_resource_group)
              backendStorageAccount: $(terraform_st_storage_account)
              backendContainer: $(terraform_st_container_name)
              backendKey: $(terraform_st_key)
              location: $(location)
              prefix: $(namespace)
              postfix: $(postfix)
              projectNumber: $(project_number)
              environment: $(environment)
              enableAmlComputeCluster: ${{ eq(variables.enable_aml_computecluster, 'true') }}
              amlComputeSku: $(aml_compute_sku)
              enableMonitoring: ${{ eq(variables.enable_monitoring, 'true') }}
              cicdPrincipalObjectId: $(cicd_principal_object_id)
              enablePrivateEndpoints: ${{ eq(variables.enable_private_endpoints, 'true') }}
              platformResourceGroupName: $(managed_devops_pool_resource_group)
              platformVirtualNetworkName: $(platform_vnet_name)
              importExistingPlatformConnectivity: ${{ eq(variables.import_existing_platform_connectivity, 'true') }}
              vnetAddressSpace: $(vnet_address_space)
              trainingSubnetAddressPrefix: $(training_subnet_address_prefix)
              endpointsSubnetAddressPrefix: $(endpoints_subnet_address_prefix)
              planFile: tfplan
              apply: true
