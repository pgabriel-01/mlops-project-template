name: bicep-ado-deploy-infra

variables:
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      # 'main' branch: PRD environment
      - template: /config-infra-prod.yml
  - ${{ if ne(variables['Build.SourceBranchName'], 'main') }}:
      # 'develop' or feature branches: DEV environment
      - template: /config-infra-dev.yml

trigger: none

pool:
  vmImage: $(ap_vm_image)

stages:
  - stage: Lint
    displayName: Lint and Preflight check
    jobs:
      - job: LintBicep
        displayName: Lint Bicep Code
        steps:
          - checkout: self
          - script: |
              az bicep build --file ./infrastructure/bicep/main.bicep
            name: LintBicepCode
            displayName: Run Bicep Linter

  - stage: PreflightValidation
    jobs:
      - job: ValidateBicepCode
        displayName: Validate Bicep Code
        steps:
          - task: AzureCli@2
            name: RunPreflightValidateion
            displayName: Run Preflight Validation
            inputs:
              azureSubscription: $(ado_service_connection_rg)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                # Get the Object ID of the service principal from the service connection
                # $servicePrincipalId is automatically populated when addSpnToEnvironment: true
                SP_OBJECT_ID=$(az ad sp show --id $servicePrincipalId --query id -o tsv)
                echo "Service Principal App ID: $servicePrincipalId"
                echo "Service Principal Object ID: $SP_OBJECT_ID"
                echo "##vso[task.setvariable variable=spObjectId;isOutput=true]$SP_OBJECT_ID"
                if [[ "$(enable_dev_jumpbox)" == "true" ]]; then
                  BASE_NAME="$(namespace)-$(postfix)$(project_number)$(environment)"
                  python3 classical/python-sdk-v2/mlops/scripts/check_legacy_bastion.py \
                    --resource-group "rg-$BASE_NAME" \
                    --base-name "$BASE_NAME"
                  az vm image show \
                    --location "$(location)" \
                    --urn "Canonical:ubuntu-24_04-lts:server:$(dev_jumpbox_ubuntu_image_version)" \
                    --only-show-errors \
                    --output none
                fi
                
                az deployment sub validate \
                  --name $(Build.DefinitionName) \
                  --template-file ./infrastructure/bicep/main.bicep \
                  --location $(location) \
                  --parameters \
                    location=$(location) \
                    prefix=$(namespace) \
                    postfix=$(postfix) \
                    env=$(environment) \
                    ciPrincipalObjectId=$SP_OBJECT_ID \
                    amlComputeSku=$(aml_compute_sku) \
                    enableMonitoring=$(enable_monitoring) \
                    enableContainerRegistry=$(enable_container_registry) \
                    enableComputeCluster=$(enable_aml_computecluster) \
                    enableVNet=$(enable_vnet) \
                    vnetAddressPrefix='$(vnet_address_prefix)' \
                    defaultSubnetPrefix='$(default_subnet_prefix)' \
                    computeSubnetPrefix='$(compute_subnet_prefix)' \
                    peSubnetPrefix='$(pe_subnet_prefix)' \
                    tagCostCenter='$(tag_cost_center)' \
                    tagManagedBy='$(tag_managed_by)' \
                    enableCMEK=$(enable_cmek) \
                    enableDefender=$(enable_defender) \
                    projectNumber='$(project_number)' \
                    teamLeadGroupId='$(team_lead_group_id)' \
                    dataScientistGroupId='$(data_scientist_group_id)' \
                    mlEngineerGroupId='$(ml_engineer_group_id)' \
                    enableAMLRegistry=$(enable_aml_registry) \
                    enableAIFoundry=$(enable_ai_foundry) \
                    enableAPIManagement=$(enable_api_management) \
                    kvEnablePurgeProtection=$(kv_enable_purge_protection) \
                    enableDevJumpbox=$(enable_dev_jumpbox) \
                    bastionSubnetPrefix='$(bastion_subnet_prefix)'

  - stage: CheckOutBicepAndDeploy
    displayName: Deploy AML Workspace
    dependsOn: PreflightValidation
    variables:
      spObjectId: $[stageDependencies.PreflightValidation.ValidateBicepCode.outputs['RunPreflightValidateion.spObjectId']]
    jobs:
      - deployment: DevDeployBicep
        displayName: Deploy Bicep
        environment: $(environment)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Running ${{ variables.environment }} Deployment
                  inputs:
                    azureSubscription: $(ado_service_connection_rg)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      az --version
                      # Get the Object ID dynamically from service connection
                      SP_OBJECT_ID=$(az ad sp show --id $servicePrincipalId --query id -o tsv)
                      echo "Service Principal App ID: $servicePrincipalId"
                      echo "Service Principal Object ID: $SP_OBJECT_ID"
                      echo "deploying bicep..."
                      if [[ "$(enable_dev_jumpbox)" == "true" ]]; then
                        BASE_NAME="$(namespace)-$(postfix)$(project_number)$(environment)"
                        python3 classical/python-sdk-v2/mlops/scripts/check_legacy_bastion.py \
                          --resource-group "rg-$BASE_NAME" \
                          --base-name "$BASE_NAME"
                        az vm image show \
                          --location "$(location)" \
                          --urn "Canonical:ubuntu-24_04-lts:server:$(dev_jumpbox_ubuntu_image_version)" \
                          --only-show-errors \
                          --output none
                      fi
                      
                      az deployment sub create \
                        --name $(Build.DefinitionName) \
                        --location $(location) \
                        --template-file ./infrastructure/bicep/main.bicep \
                        --parameters \
                          location=$(location) \
                          prefix=$(namespace) \
                          postfix=$(postfix) \
                          env=$(environment) \
                          ciPrincipalObjectId=$SP_OBJECT_ID \
                          amlComputeSku=$(aml_compute_sku) \
                          enableMonitoring=$(enable_monitoring) \
                          enableContainerRegistry=$(enable_container_registry) \
                          enableComputeCluster=$(enable_aml_computecluster) \
                          enableVNet=$(enable_vnet) \
                          vnetAddressPrefix='$(vnet_address_prefix)' \
                          defaultSubnetPrefix='$(default_subnet_prefix)' \
                          computeSubnetPrefix='$(compute_subnet_prefix)' \
                          peSubnetPrefix='$(pe_subnet_prefix)' \
                          tagCostCenter='$(tag_cost_center)' \
                          tagManagedBy='$(tag_managed_by)' \
                          enableCMEK=$(enable_cmek) \
                          enableDefender=$(enable_defender) \
                          projectNumber='$(project_number)' \
                          teamLeadGroupId='$(team_lead_group_id)' \
                          dataScientistGroupId='$(data_scientist_group_id)' \
                          mlEngineerGroupId='$(ml_engineer_group_id)' \
                          enableAMLRegistry=$(enable_aml_registry) \
                          enableAIFoundry=$(enable_ai_foundry) \
                          enableAPIManagement=$(enable_api_management) \
                          kvEnablePurgeProtection=$(kv_enable_purge_protection) \
                          enableDevJumpbox=$(enable_dev_jumpbox) \
                          bastionSubnetPrefix='$(bastion_subnet_prefix)'
